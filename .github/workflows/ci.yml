# Merge-blocking CI. Least-privilege GITHUB_TOKEN, SHA-pinned actions, and the
# same gates run locally (`make verify`) plus supply-chain checks. Every action
# is pinned to a full 40-char commit SHA with its version in a trailing comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A push to a branch is not a superseded pull-request commit. Keying the group
  # on the ref alone gave every commit on `main` ONE shared slot: GitHub allows
  # one running plus one pending run per group, so a second push cancels the run
  # the first commit was still executing (`cancel-in-progress: true`), and a
  # third push evicts the second from the pending slot (`false`). Either way the
  # commit lands with no verdict at all, and it is reported as `cancelled` or is
  # simply absent -- never as red -- so nothing surfaces it.
  #
  # The discriminator below gives each pushed commit its own slot while leaving
  # pull-request runs grouped per PR, so a superseded PR commit is still
  # canceled. `cancel-in-progress` is deliberately unchanged.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked
      - name: Verify (ruff, mypy strict, pytest with 90% coverage gate)
        run: make verify
      - name: Run the gates against the toy and render a report
        run: make demo

  # The documentation site, built and then checked without a browser: HTML
  # conformance and the markup-level accessibility rules through html-validate,
  # and the six axe tags `tools/a11y.mjs` configures through axe-core in a
  # headless DOM. Nothing is served and nothing is deployed here; both checkers
  # read files off disk. Deploying is a separate workflow that runs only on main.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked environment
        run: uv sync --locked
      - name: Build the site and check it (html-validate, axe-core, npm audit)
        run: make pages
      - name: The site build must produce byte-identical output twice
        run: |
          set -euo pipefail
          find site -type f | sort | xargs shasum -a 256 > /tmp/site-first.txt
          rm -rf site
          make site
          find site -type f | sort | xargs shasum -a 256 > /tmp/site-second.txt
          diff /tmp/site-first.txt /tmp/site-second.txt

  # Exercises the published composite action the way an external consumer would,
  # from a checkout that is not on PATH and with no local environment set up.
  # A gate failure must block, so this job also proves the blocking path.
  #
  # The action itself is referenced as `$/`, GitHub's self-repository syntax:
  # it resolves to this repository at the commit the workflow is running, so an
  # earlier step that wrote into the workspace cannot decide which action runs.
  # `./` reads the action off the runner's filesystem instead, which is why
  # zizmor's `self-repository` audit reports it. The checkout above still has to
  # happen: the steps below pass workspace paths as inputs and read files the
  # run produces.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the action against the built-in suites
        id: gauntlet
        uses: $/
        with:
          job-summary: "false"
      - name: The action reported counts the harness produced
        env:
          PASSED: ${{ steps.gauntlet.outputs.passed }}
          GATES_TOTAL: ${{ steps.gauntlet.outputs.gates-total }}
          GATES_FAILED: ${{ steps.gauntlet.outputs.gates-failed }}
          CASES_TOTAL: ${{ steps.gauntlet.outputs.cases-total }}
          REPORT: ${{ steps.gauntlet.outputs.report-path }}
          JSON: ${{ steps.gauntlet.outputs.json-path }}
        run: |
          set -euo pipefail
          test "$PASSED" = "true"
          test "$GATES_FAILED" = "0"
          test "$GATES_TOTAL" -ge 1
          test "$CASES_TOTAL" -ge 1
          test -s "$REPORT"
          test -s "$JSON"
          grep -q "not approved or endorsed by, the State of California" "$REPORT"
      - name: Run the action against the deliberately broken example target
        id: broken
        uses: $/
        with:
          working-directory: examples
          cases: cases
          target-callable: broken_target:make_target
          results-path: broken-results.json
          report-path: broken-evidence.md
          json-path: broken-evidence.json
          fail-on-gate-failure: "false"
          job-summary: "false"
      - name: The failing run is reported as failing, not swallowed
        working-directory: examples
        env:
          PASSED: ${{ steps.broken.outputs.passed }}
          GATES_FAILED: ${{ steps.broken.outputs.gates-failed }}
          CASES_FAILED: ${{ steps.broken.outputs.cases-failed }}
        run: |
          set -euo pipefail
          test "$PASSED" = "false"
          test "$GATES_FAILED" -ge 1
          test "$CASES_FAILED" -ge 1
          grep -q "uncited answer" broken-evidence.md

      # A target that says nothing, against a case set whose every check is
      # phrased as an absence. Before the readability floor this combination
      # scored a perfect pass rate and exited 0. The action must fail the job
      # even with fail-on-gate-failure off, because the run was not scored at
      # all rather than scored and failed.
      - name: Run the action against a mute target and an absence-only case set
        id: mute
        continue-on-error: true
        uses: $/
        with:
          working-directory: examples
          cases: cases-absence-only
          target-callable: broken_target:make_mute_target
          results-path: mute-results.json
          report-path: mute-evidence.md
          json-path: mute-evidence.json
          fail-on-gate-failure: "false"
          job-summary: "false"
      - name: The unscoreable run failed the step instead of reporting a pass
        working-directory: examples
        env:
          OUTCOME: ${{ steps.mute.outcome }}
          PASSED: ${{ steps.mute.outputs.passed }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          # The evidence pack must never have been built for a run with no verdict.
          test ! -f mute-evidence.md
          test -z "$PASSED"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: uv build

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"
          python-version: "3.12"
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes > /tmp/runtime-requirements.txt
          if test -s /tmp/runtime-requirements.txt; then
            uvx --from pip-audit==2.10.1 pip-audit --strict --requirement /tmp/runtime-requirements.txt
          else
            echo "No runtime dependencies to audit."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Puts the whole history on disk. Necessary, and on its own not
          # sufficient: how much of that history is read is decided by how the
          # scanner is invoked, in the step below, not by how much was fetched.
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        # This step used to be `gitleaks/gitleaks-action`, which picks its scan
        # range from the triggering event. Read at the pinned SHA, its
        # `Scan()` builds `gitleaks detect` and then, for a push, appends
        # `--log-opts=--no-merges --first-parent BASE^..HEAD` -- or, when the
        # push carries a single commit, `--log-opts=-1`, i.e. exactly one
        # commit. A pull_request run gets that same range over the PR's own
        # commits. Only `schedule` and `workflow_dispatch` runs are handed no
        # range at all, and this workflow declares neither trigger, so no lane
        # here ever read more than one commit of `main`'s 61. A credential
        # added in one commit and deleted in the next was invisible to it.
        #
        # `fetch-depth: 0` above did not prevent that and could not: it governs
        # what `actions/checkout` fetches, not what the scanner is asked to
        # read.
        #
        # A pinned, checksum-verified binary invoked as `gitleaks git .` with
        # no `--log-opts` walks `git log --full-history --all`, on every event.
        # That is wider than `main` alone, so the commit count this step prints
        # is expected to exceed 61 rather than match it.
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          # --retry retries the DOWNLOAD, never the verdict. Elsewhere in this
          # portfolio a transient `curl: (35) Recv failure` from github.com
          # turned this check red having read zero commits, which reads in the
          # check list exactly like a real finding. `curl -f` plus the
          # `set -euo pipefail` above still fail the job if every attempt
          # fails, and the scan itself is run once.
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          # `.gitleaks.toml` and `.gitleaksignore` sit at the repository root
          # and are discovered from the scan path; no --config is passed, so
          # neither the pinned allowlist nor the pinned fingerprint changes.
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"
          python-version: "3.12"
      - name: Semgrep
        # Scope: every top-level directory holding tracked Python, not a hand-kept subset.
        # `real_targets/` and `tools/` were outside this list while the README counted
        # "zero Semgrep findings" among the merge-blocking floors, so the adapters that
        # fetch public documents over the network, and the live-site checker, were the
        # code SAST did not read. `test_the_sast_scope_covers_every_python_root` derives
        # the required set from the tree and fails when a new root appears.
        run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python src tests examples real_targets tools

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Code scanning is not set up on this repository, so the default
          # SARIF-upload path fails at the upload step. Emit plain GitHub Actions
          # annotations instead; zizmor's own exit code still fails the job on
          # real findings.
          advanced-security: false
          annotations: true
